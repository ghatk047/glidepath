# Glidepath: all three tiers in one Compose project (docs/architecture/11_docker_deployment.md).
#
#   cp .env.example .env        # then fill the secrets (README "Running locally")
#   docker compose up -d        # https://localhost
#
# Networks (physical tier separation, G13):
#   edge   web <-> logic (and mail in the dev and demo profiles)
#   data   internal: true; logic, worker, migrate <-> db. web is NOT on it.
#   egress outbound internet for the worker (Claude API) and logic (Cloudflare Access signing keys, OPS-09)
#
# Demo (docs/architecture/02_repo_and_conventions.md section 4): `docker compose --profile demo up -d` runs the
# images tagged demo-2026-12-04, each pinned by digest, plus the local mail sink so magic links work offline.
# `ops/demo-pin.sh` builds or tags the images and writes TAG, COMPOSE_PROFILES=demo and the four *_IMAGE_PIN
# digests into .env (ops/README.md "Demo profile"); then `ops/demo-check.sh` verifies the stack.
#
# Public demo (OPS-09, ops/README.md "Public demo (Cloudflare)"): `docker compose --profile demo --profile tunnel up -d`
# adds `tunnel`, a cloudflared connector (TUNNEL_TOKEN) that serves web at PUBLIC_BASE_URL through a Cloudflare
# Tunnel; Cloudflare Access signs visitors in and logic verifies its JWT (CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD).
#
# Configuration is environment only (12-factor, ADR-013). Compose reads .env for the ${...}
# values below and hands each service only the settings it needs. Tier 2 gets the database
# from DATABASE_URL / DATABASE_URL_MIGRATE and nothing else (ADR-015), so a managed Postgres
# such as Neon is a URL change plus `-f docker-compose.neon.yml` (drops the db service).

name: glidepath

x-logic: &logic
  image: glidepath/logic:${TAG:-dev}${LOGIC_IMAGE_PIN:-}
  build:
    context: .
    dockerfile: ops/docker/logic/Dockerfile
  init: true
  security_opt: ["no-new-privileges:true"]

# Settings shared by every tier-2 process. The DB URLs are added per service.
x-logic-env: &logic-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-}
  OBJECT_STORE: ${OBJECT_STORE:-postgres}

networks:
  edge: {}
  data:
    internal: true
  egress: {}

volumes:
  pgdata: {}
  caddydata: {}

services:
  # ---------------------------------------------------------------- tier 3
  db:
    image: postgres:16.16-bookworm${DB_IMAGE_PIN:-}
    restart: unless-stopped
    environment:
      # Bootstrap superuser of the local container only. Tier 2 never sees these.
      POSTGRES_USER: postgres
      POSTGRES_DB: glidepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Read by tier3-data/postgres/init to create glidepath_owner and glidepath_app.
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tier3-data/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      # TCP on purpose: the entrypoint's temporary init server listens on the socket only,
      # so this turns healthy after the init scripts have run.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "glidepath"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- tier 2
  migrate:
    <<: *logic
    # One-shot: migrations, model defs and the AA seed; logic and worker wait for it. The shell adds the demo
    # inputs the image carries when they exist (a plain checkout has neither): `--parity` records the parity
    # replay the Airlines tile shows (`pnpm parity:golden --out tier3-data/seed/parity` before the build, API-14) and
    # `--ai-cache` imports the rehearsed UA reconfiguration (`pnpm ai:rehearse --tenant ua`, AI-07). `$$` is Compose's `$`.
    command:
      - sh
      - -c
      - >-
        d=/app/tier3-data/seed;
        [ -f $$d/parity/golden-report.json ] && [ -f $$d/parity/replay-report.json ] && set -- "$$@" --parity $$d/parity;
        [ -f $$d/ai-cache/ua/manifest.json ] && set -- "$$@" --ai-cache $$d/ai-cache/ua;
        exec node dist/migrate.js "$$@"
      - migrate
      - --seed
      - aa
    restart: "no"
    environment:
      <<: *logic-env
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?set DATABASE_URL_MIGRATE in .env (see .env.example)}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      # 1 pre-runs the Cockpit odds and fastest-path solvers into the result cache after the seed (JOB-04).
      WARM: ${WARM:-1}
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  logic:
    <<: *logic
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment:
      <<: *logic-env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (see .env.example)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      SMTP_URL: ${SMTP_URL:-}
      SESSION_IDLE_MIN: ${SESSION_IDLE_MIN:-}
      AUTH_LINK_TTL_MIN: ${AUTH_LINK_TTL_MIN:-}
      # Cloudflare Access sign-in (OPS-09); both empty = off.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ACCESS_AUTO_TENANTS: ${ACCESS_AUTO_TENANTS:-}
      ACCESS_AUTO_ROLE: ${ACCESS_AUTO_ROLE:-}
      ACCESS_ALLOWED_DOMAINS: ${ACCESS_ALLOWED_DOMAINS:-}
    # egress: only for https://<team>.cloudflareaccess.com/cdn-cgi/access/certs (OPS-09). web is still not on data.
    networks: [edge, data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # node is the only tool guaranteed in the slim image (no wget/curl).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *logic
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *logic-env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (see .env.example)}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MAX_TOKENS_PER_JOB: ${AI_MAX_TOKENS_PER_JOB:-}
    networks: [data, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ---------------------------------------------------------------- tier 1
  web:
    image: glidepath/web:${TAG:-dev}${WEB_IMAGE_PIN:-}
    build:
      context: .
      dockerfile: ops/docker/web/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
    ports:
      # 127.0.0.1 by default so the laptop does not serve the LAN; set
      # WEB_BIND_ADDRESS=0.0.0.0 on a cloud VM.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - caddydata:/data # Caddy's local CA and certificates survive `down`/`up`
    networks: [edge]
    depends_on:
      logic: { condition: service_healthy }

  # ---------------------------------------------------------------- dev and demo
  mail:
    # Catches magic-link emails: http://localhost:8025 (SMTP_URL=smtp://mail:1025). Also in the demo profile:
    # sign-in works with Wi-Fi off, and ops/demo-check.sh signs in through it (GAP-09).
    image: axllent/mailpit:v1.33.1${MAIL_IMAGE_PIN:-}
    profiles: [dev, demo]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------- public demo (OPS-09)
  tunnel:
    # Cloudflare Tunnel connector: outbound only, nothing published. The public hostname is set in the Cloudflare
    # dashboard (Zero Trust > Networks > Tunnels > the tunnel > Public hostname): service https://web:443, origin
    # server name = the PUBLIC_BASE_URL host (Caddy's site address), No TLS Verify on (Caddy's `tls internal`
    # certificate). Edge network only: it reaches web, never db (G13).
    image: cloudflare/cloudflared:2026.11.2${TUNNEL_IMAGE_PIN:-}
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    restart: unless-stopped
    environment:
      # cloudflared reads the tunnel token from TUNNEL_TOKEN (dashboard: the tunnel's install command).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    depends_on:
      web: { condition: service_started }
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
