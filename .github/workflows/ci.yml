name: CI

# Gate jobs G1-G14 (docs/architecture/08_quality_and_testing.md section 1).
# G10 (storyline, QA-05) runs nightly and on demand (before the freeze); G11/G12 (UI) are not part of this item.
# Object store: none (ADR-025).
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 3 * * *" # nightly: G4, G5, G8, G10, G14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Postgres service container (same host/port for every job that declares it).
  DATABASE_URL: postgresql://postgres@localhost:5432/glidepath?sslmode=disable
  DATABASE_URL_MIGRATE: postgresql://postgres@localhost:5432/glidepath?sslmode=disable
  TEST_DATABASE_URL: postgresql://postgres@localhost:5432/glidepath?sslmode=disable
  # Base for affected-package selection (turbo --filter=...[BASE]).
  TURBO_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD^1' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.paths.outputs.spec }}
      engine: ${{ steps.paths.outputs.engine }}
      solvers: ${{ steps.paths.outputs.solvers }}
      excel: ${{ steps.paths.outputs.excel }}
      tenancy: ${{ steps.paths.outputs.tenancy }}
      perf: ${{ steps.paths.outputs.perf }}
      infra: ${{ steps.paths.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select gates by changed paths
        id: paths
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only origin/main...HEAD)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            files="$(git diff --name-only HEAD^1 HEAD || true)"
          else
            files="ALL"
          fi
          hit() { [ "$files" = "ALL" ] && return 0; echo "$files" | grep -Eq "$1" && return 0 || return 1; }
          out() { if hit "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          out spec '^(docs/spec/|tier2-logic/spec/|tier2-logic/engine/|tier3-data/|tools/parity/|package\.json$)'
          out engine '^(docs/spec/|tier2-logic/engine/|tier2-logic/spec/|tools/parity/|package\.json$)'
          out solvers '^(tier2-logic/solvers/|tier2-logic/engine/|tools/parity/|docs/spec/reference/solver_demo_results\.json$)'
          out excel '^tier2-logic/excel/'
          out tenancy '^(tier2-logic/data-access/|tier2-logic/server/|tier2-logic/worker/|tier3-data/)'
          out perf '^(tier2-logic/engine/|tier2-logic/server/)'
          out infra '^(docker-compose|ops/|tier3-data/|tier1-presentation/web/|tier2-logic/(server|worker)/|tools/int/|\.github/)'

  G1:
    name: G1 Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: actionlint (workflow YAML)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Workflow tests (gate names, services, no inline credentials)
        run: pnpm exec vitest run --root .github/workflows
      - name: Typecheck and lint (affected packages)
        run: pnpm turbo run typecheck lint --filter="...[$TURBO_BASE]"

  G2:
    name: G2 Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: glidepath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glidepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          # engine.py is the parity oracle; float sum() of mixed int/float differs across CPython minors.
          python-version-file: .python-version
      - name: Postgres reachable (SELECT 1)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' && psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: PostgreSQL 16 binaries for pg-local tests (initdb/pg_ctl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-16
          sudo systemctl stop postgresql || true
          test -x /usr/lib/postgresql/16/bin/initdb
      - name: Unit tests with coverage (affected packages)
        # Shared CI runners are 3-6x slower than a dev machine (tsc spawns, pg-local clusters); per-test timeouts stay at the default locally.
        run: pnpm turbo run test --concurrency=2 --filter="...[$TURBO_BASE]" -- --testTimeout=30000 --hookTimeout=60000

  G13:
    name: G13 Tier separation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script tier-check
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['tier-check'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm tier-check is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Boundary lint (tier imports)
        run: pnpm turbo run lint --filter="...[$TURBO_BASE]"
      # WEB-01 has landed, so the bundle is built here and a missing bundle fails the gate
      # (without it tier-check would skip with exit 0 and the gate would be green by default).
      - name: Build the web bundle (input of tier-check)
        if: steps.probe.outputs.ready == 'true'
        run: pnpm --filter "@glidepath/web..." --if-present run build
      - name: tier-check (no tier 2 code or SQL in the web bundle)
        if: steps.probe.outputs.ready == 'true'
        run: pnpm tier-check --require-bundle

  parity-golden:
    name: G3 Golden parity
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script parity:golden
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['parity:golden'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm parity:golden is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Run G3 Golden parity
        if: steps.probe.outputs.ready == 'true'
        run: pnpm parity:golden

  parity-fuzz:
    name: G4 Fuzz parity
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          # engine.py is the parity oracle; float sum() of mixed int/float differs across CPython minors.
          python-version-file: .python-version
      - name: Probe script parity:fuzz
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['parity:fuzz'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm parity:fuzz is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Run G4 Fuzz parity
        if: steps.probe.outputs.ready == 'true'
        run: pnpm parity:fuzz

  solvers:
    name: G5 Solver acceptance
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.solvers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script test:solvers
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['test:solvers'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm test:solvers is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Run G5 Solver acceptance
        if: steps.probe.outputs.ready == 'true'
        run: pnpm test:solvers

  excel:
    name: G6 Excel round trip
    needs: changes
    if: needs.changes.outputs.excel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script test:excel
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['test:excel'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm test:excel is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Run G6 Excel round trip
        if: steps.probe.outputs.ready == 'true'
        run: pnpm test:excel

  leak:
    name: G7 Tenancy
    needs: changes
    if: needs.changes.outputs.tenancy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: glidepath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glidepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script test:leak
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['test:leak'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm test:leak is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Postgres reachable (SELECT 1)
        if: steps.probe.outputs.ready == 'true'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' && psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Run G7 Tenancy
        if: steps.probe.outputs.ready == 'true'
        run: pnpm test:leak

  perf:
    name: G8 Perf budget
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: glidepath
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glidepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script bench
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['bench'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm bench is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Postgres reachable (SELECT 1)
        if: steps.probe.outputs.ready == 'true'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' && psql "$DATABASE_URL_MIGRATE" -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Run G8 Perf budget
        if: steps.probe.outputs.ready == 'true'
        run: pnpm bench --filter=./tier2-logic/engine

  e2e:
    name: G9 E2E smoke
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script e2e
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['e2e'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm e2e is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Generate .env (random, never committed)
        if: steps.probe.outputs.ready == 'true'
        run: |
          cp .env.example .env
          perl -pi -e 's{^(POSTGRES_PASSWORD|OWNER_DB_PASSWORD|APP_DB_PASSWORD|AUTH_SECRET)=$}{my $r = qx(openssl rand -hex 24); chomp $r; "$1=$r"}e' .env
      - name: Compose up (seeded)
        if: steps.probe.outputs.ready == 'true'
        # The job-level DATABASE_URL* point at the CI Postgres service on localhost; inside the stack the .env values (host db) must win.
        run: env -u DATABASE_URL -u DATABASE_URL_MIGRATE -u TEST_DATABASE_URL docker compose up -d --build --wait --wait-timeout 180
      - name: Install Playwright Chromium
        if: steps.probe.outputs.ready == 'true'
        run: pnpm --filter @glidepath/e2e exec playwright install --with-deps chromium
      - name: Run G9 E2E smoke
        if: steps.probe.outputs.ready == 'true'
        run: pnpm e2e -- --trace off
      - name: Run the M2 integration spec on the same stack (e2e/tests/m2.spec.ts, INT-03)
        if: steps.probe.outputs.ready == 'true'
        # M2 exit (09 §1): the Cockpit of preset C shows the numbers the spec quotes, an edit
        # survives a reload, and the global layer works. Writes the status note's screenshots.
        run: pnpm int:m2 -- --trace off
      - name: Compose logs on failure
        if: failure() && steps.probe.outputs.ready == 'true'
        run: docker compose logs --no-color --tail 200

  storyline:
    name: G10 Demo storyline
    # Nightly, and by hand before the freeze (workflow_dispatch): the 11 beats of the run of show and the
    # "Ready for questions" moves in a browser against the seeded compose stack (QA-05).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe script e2e:storyline
        id: probe
        run: |
          if node -e "const s=require('./package.json').scripts['e2e:storyline'];process.exit(s&&!/not implemented yet/.test(s)?0:1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::pnpm e2e:storyline is still a placeholder (or missing); skipping this gate until it is implemented."
          fi
      - name: Generate .env (random, never committed)
        if: steps.probe.outputs.ready == 'true'
        run: |
          cp .env.example .env
          perl -pi -e 's{^(POSTGRES_PASSWORD|OWNER_DB_PASSWORD|APP_DB_PASSWORD|AUTH_SECRET)=$}{my $r = qx(openssl rand -hex 24); chomp $r; "$1=$r"}e' .env
      - name: Compose up (seeded)
        if: steps.probe.outputs.ready == 'true'
        # The job-level DATABASE_URL* point at the CI Postgres service on localhost; inside the stack the .env values (host db) must win.
        run: env -u DATABASE_URL -u DATABASE_URL_MIGRATE -u TEST_DATABASE_URL docker compose up -d --build --wait --wait-timeout 180
      - name: Install Playwright Chromium
        if: steps.probe.outputs.ready == 'true'
        run: pnpm --filter @glidepath/e2e exec playwright install --with-deps chromium
      - name: Run G10 Demo storyline
        if: steps.probe.outputs.ready == 'true'
        run: pnpm e2e:storyline -- --trace off
      - name: Compose logs on failure
        if: failure() && steps.probe.outputs.ready == 'true'
        run: docker compose logs --no-color --tail 200

  compose:
    name: G14 Container
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe Dockerfiles
        id: probe
        run: |
          if [ -f ops/docker/logic/Dockerfile ] && [ -f ops/docker/web/Dockerfile ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::ops/docker/*/Dockerfile not present yet (placeholder); skipping the container gate until the images exist."
          fi
      - name: Generate .env (random, never committed)
        if: steps.probe.outputs.ready == 'true'
        run: |
          cp .env.example .env
          perl -pi -e 's{^(POSTGRES_PASSWORD|OWNER_DB_PASSWORD|APP_DB_PASSWORD|AUTH_SECRET)=$}{my $r = qx(openssl rand -hex 24); chomp $r; "$1=$r"}e' .env
      - name: Compose up from clean volumes, timings and web-cannot-reach-db test (ops/compose-check.sh, OPS-05)
        if: steps.probe.outputs.ready == 'true'
        run: |
          # Exit codes: 0 PASS, 1 FAIL, 2 USAGE, 3 BUDGET (over 180 s), 4 PENDING (a stubbed
          # entry; cannot happen now that the logic image builds with STRICT_ENTRYPOINTS=1).
          # The last output line is "compose-check: <STATUS>: <reason>".
          set +e
          # The job-level DATABASE_URL* point at the CI service on localhost; inside the stack they
          # must come from .env, and shell variables would override .env in compose interpolation.
          env -u DATABASE_URL -u DATABASE_URL_MIGRATE -u TEST_DATABASE_URL ops/compose-check.sh --keep 2>&1 | tee compose-check.log
          rc=${PIPESTATUS[0]}
          set -e
          reason="$(tail -n 1 compose-check.log)"
          case "$rc" in
            0) ;;
            4) echo "::notice title=G14 PENDING::$reason" ;;
            *) echo "::error title=G14 Container::$reason"; exit "$rc" ;;
          esac
      - name: Run M1 integration on the seeded stack (tools/int/m1.spec.ts, INT-02)
        if: steps.probe.outputs.ready == 'true'
        # The stack compose-check kept up: WS preview, POST /changesets fork + recompute, GET calc = golden C.
        run: INT_COMPOSE_PROJECT=glidepath-check pnpm int:m1
      - name: Multi-arch image build
        if: steps.probe.outputs.ready == 'true'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx build --platform linux/arm64,linux/amd64 -f ops/docker/logic/Dockerfile .
          docker buildx build --platform linux/arm64,linux/amd64 -f ops/docker/web/Dockerfile .
      - name: Compose logs on failure
        if: failure() && steps.probe.outputs.ready == 'true'
        run: docker compose -p glidepath-check logs --no-color --tail 200
